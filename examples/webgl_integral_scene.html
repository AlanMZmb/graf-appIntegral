<!DOCTYPE html>
<html lang="en">
<head>
	<title>Integral 3D Scene</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no">
	<link type="text/css" rel="stylesheet" href="main.css">
</head>

<body>

<script type="importmap">
{
	"imports": {
		"three": "../build/three.module.js",
		"three/addons/": "./jsm/"
	}
}
</script>

<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

let camera, scene, renderer, controls, player, mixer;

const actions = {};
const obstacles = [];
const obstacleBoxes = [];

let currentAction;
let isJumping = false;

const clock = new THREE.Clock();
const keys = {};

const moveSpeed = 0.05;

const rotateSpeed = 0.03;
const cameraOffset = new THREE.Vector3(0, 150, -250);

init();
animate();

function init() {

	scene = new THREE.Scene();

	camera = new THREE.PerspectiveCamera(
		75,
		window.innerWidth / window.innerHeight,
		0.1,
		1000
	);

	camera.position.set(0, 5, 10);

	renderer = new THREE.WebGLRenderer({ antialias: true });
	renderer.setSize(window.innerWidth, window.innerHeight);

	document.body.appendChild(renderer.domElement);
    controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.update();
    controls.enablePan = false;

	const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
	scene.add(hemiLight);

	const dirLight = new THREE.DirectionalLight(0xffffff, 1);
	dirLight.position.set(5, 10, 7);
	scene.add(dirLight);

	const floorGeometry = new THREE.PlaneGeometry(50, 50);

	const floorTexture = new THREE.TextureLoader().load('textures/grass.jpg');

    floorTexture.wrapS = THREE.RepeatWrapping;
    floorTexture.wrapT = THREE.RepeatWrapping;

    floorTexture.repeat.set(10, 10);

    const floorMaterial = new THREE.MeshStandardMaterial({
        map: floorTexture,
        roughness: 1,
        metalness: 0
    });

	const floor = new THREE.Mesh(floorGeometry, floorMaterial);

	floor.rotation.x = -Math.PI / 2;

	scene.add(floor);

    for (let i = 0; i < 5; i++) {

        const obstacle = new THREE.Mesh(

            new THREE.ConeGeometry(1, 3, 16),

            new THREE.MeshStandardMaterial({
                color: 0xff6600
            })

        );

        obstacle.position.set(
            (Math.random() - 0.5) * 30,
            1,
            (Math.random() - 0.5) * 30
        );

        scene.add(obstacle);

        obstacles.push(obstacle);

        obstacleBoxes.push(
            new THREE.Box3().setFromObject(obstacle)
        );

    }
    
    new RGBELoader().load(
        'models/rgbe/stadium_01_4k.hdr',
        function (texture) {

            texture.mapping = THREE.EquirectangularReflectionMapping;

            scene.background = texture;

        }
    );

    const loader = new FBXLoader();

    loader.load('models/fbx/player.fbx', function (object) {

        player = object;

        player.scale.set(0.01, 0.01, 0.01);

        player.position.set(0, 0, 0);

        scene.add(player);

        mixer = new THREE.AnimationMixer(player);

        const animLoader = new FBXLoader();

        animLoader.load('models/fbx/idle.fbx', function (anim) {

            actions.idle = mixer.clipAction(anim.animations[0]);

            actions.idle.play();

            currentAction = actions.idle;

        });

        animLoader.load('models/fbx/walking.fbx', function (anim) {

            actions.walk = mixer.clipAction(anim.animations[0]);

        });

        animLoader.load('models/fbx/run.fbx', function (anim) {

            actions.run = mixer.clipAction(anim.animations[0]);

        });

        animLoader.load('models/fbx/jump.fbx', function (anim) {

            actions.jump = mixer.clipAction(anim.animations[0]);

            actions.jump.setLoop(THREE.LoopOnce);

            actions.jump.clampWhenFinished = true;

        });

        

    });

    document.addEventListener('keydown', (event) => {

        keys[event.key.toLowerCase()] = true;

        if (event.code === 'Space') {

            if (!isJumping && actions.jump) {

                isJumping = true;

                currentAction.stop();

                currentAction = actions.jump;

                currentAction.reset();

                currentAction.play();

                setTimeout(() => {

                    isJumping = false;

                    currentAction.stop();

                    currentAction = actions.idle;

                    currentAction.play();

                }, 1000);

            }

        }

    });

    

    document.addEventListener('keyup', (event) => {

        keys[event.key.toLowerCase()] = false;

    });

	window.addEventListener('resize', onWindowResize);

}

function onWindowResize() {

	camera.aspect = window.innerWidth / window.innerHeight;

	camera.updateProjectionMatrix();

	renderer.setSize(window.innerWidth, window.innerHeight);

}

function animate() {

	requestAnimationFrame(animate);

    const delta = clock.getDelta();

    if (mixer) mixer.update(delta);

    if (player) {
        const previousPosition = player.position.clone();
        let moving = false;
        let running = false;

        if (keys['w']) {
            
            moving = true;
            if (keys['shift']) {

            running = true;

            player.translateZ(moveSpeed * 2);

        } else {

            player.translateZ(moveSpeed);

        }

        }

        if (keys['a']) {

            player.rotation.y += rotateSpeed;

        }

        if (keys['d']) {

            player.rotation.y -= rotateSpeed;

        }

        const playerBox = new THREE.Box3().setFromObject(player);

        let collided = false;

        for (const box of obstacleBoxes) {

            if (playerBox.intersectsBox(box)) {

                collided = true;

                break;

            }

        }

        if (collided) {

            player.position.copy(previousPosition);

        }

        const offset = cameraOffset.clone();

        offset.applyMatrix4(player.matrixWorld);

        camera.position.lerp(offset, 0.1);

        const lookTarget = player.position.clone();

        if (!isJumping){
            if (running) {

                if (currentAction !== actions.run && actions.run) {

                    currentAction.stop();

                    currentAction = actions.run;

                    currentAction.play();

                }

            } else if (moving) {

                if (currentAction !== actions.walk && actions.walk) {

                    currentAction.stop();

                    currentAction = actions.walk;

                    currentAction.play();

                }

            } else {

                if (currentAction !== actions.idle && actions.idle) {

                    currentAction.stop();

                    currentAction = actions.idle;

                    currentAction.play();

                }

            }
        }

    }

	renderer.render(scene, camera);

}

</script>

</body>
</html>
